<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yearly Expense Tracker</title>

  <link rel="shortcut icon" href="./assets/yearly-expenses-icon.png" type="image/x-icon" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="welcome.css">
</head>

<body>
  <div class="welcome-body">
    <nav>
      <a href="../catalogue.html" id="logout">
        <i class="bi bi-power"></i></a>

      <a href="./edit-data/edit.html" id="edit-data">
        <i class="bi bi-pencil-fill"></i>
      </a>
    </nav>

    <figure>
      <img src="./assets/yearly-expanse.png" alt="Logo" width="100%" />
    </figure>

    <form>
      <div id="month-input">
        <label for="">Enter the current month: </label>
        <div class="input-field">
          <i class="bi bi-calendar3"></i>
          <input type="text" name="month" id="month" readonly autofocus>
        </div>
        <div id="month-select">
          <div class="year-section">
            <span id="current-year"></span>
          </div>
          <ul id="month-name">
            <li data-id="1" data-value="January">Jan</li>
            <li data-id="2" data-value="February">Feb</li>
            <li data-id="3" data-value="March">Mar</li>
            <li data-id="4" data-value="April">Apr</li>
            <li data-id="5" data-value="May">May</li>
            <li data-id="6" data-value="June">Jun</li>
            <li data-id="7" data-value="July">Jul</li>
            <li data-id="8" data-value="August">Aug</li>
            <li data-id="9" data-value="September">Sep</li>
            <li data-id="10" data-value="October">Oct</li>
            <li data-id="11" data-value="November">Nov</li>
            <li data-id="12" data-value="December">Dec</li>
          </ul>
          <div id="month-btn">
            <button type="button">OK</button>
          </div>
        </div>
      </div>

      <div>
        <label for="expense">Enter Total Saving: </label>
        <div class="input-field">
          <i class="bi bi-currency-rupee"></i>
          <input type="number" name="saving" id="saving" placeholder="0000.00">
        </div>
      </div>

      <button type="button" id="show-transition-btn">
        SHOW TRANSITION
      </button>
    </form>
  </div>

  <script src="welcome.js"></script>
</body>

</html>
